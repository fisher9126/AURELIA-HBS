# Aurelia HBS — toàn bộ hệ thống: docker compose up -d --build
#   Web (khách, lễ tân, quản trị) : http://localhost
#   API + Swagger                 : http://localhost:8080/swagger-ui.html
#   Mailpit (email thử)           : http://localhost:8025
#   Kho ảnh S3 (SeaweedFS)        : http://localhost:9000
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurelia-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aurelia}
      POSTGRES_USER: ${DB_USER:-aurelia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aurelia_dev}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aurelia} -d ${DB_NAME:-aurelia}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: aurelia-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kho ảnh tương thích S3. MinIO đã gỡ image miễn phí khỏi Docker Hub/Quay (09/2026) nên dùng SeaweedFS.
  # Tài khoản ghi = MINIO_ACCESS_KEY/MINIO_SECRET_KEY; khách vô danh chỉ được đọc (ảnh phòng công khai).
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: aurelia-s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[
          {"name":"aurelia","credentials":[{"accessKey":"${MINIO_ACCESS_KEY:-aurelia}","secretKey":"${MINIO_SECRET_KEY:-aurelia_minio_dev}"}],"actions":["Admin","Read","List","Tagging","Write"]},
          {"name":"anonymous","actions":["Read"]}]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=20 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: aurelia-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    container_name: aurelia-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aurelia}
      DB_USER: ${DB_USER:-aurelia}
      DB_PASSWORD: ${DB_PASSWORD:-aurelia_dev}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-bytes}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-stay@aureliaresort.vn}
      MINIO_ENDPOINT: http://s3:8333
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aurelia}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-aurelia_minio_dev}
      APP_API_URL: ${APP_API_URL:-http://localhost}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost,http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
    ports:
      - "8080:8080"

  # Giao diện React (Nginx): http://localhost — /api được proxy sang api:8080
  web:
    build: ./frontend
    container_name: aurelia-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

  # Kiểm thử hiệu năng: docker compose --profile perf run --rm k6 run /perf/search-load.js
  k6:
    image: grafana/k6:0.54.0
    profiles: ["perf"]
    depends_on:
      - api
    environment:
      BASE_URL: http://api:8080/api/v1
    volumes:
      - ./backend/perf:/perf:ro

volumes:
  pgdata:
  s3data:
