# Một origin duy nhất (http://localhost): SPA + /api → backend.
# Nhờ cùng origin, cookie refresh_token (SameSite=Strict, Path=/api/v1/auth) hoạt động không cần CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;   # ảnh phòng tối đa 5MB

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; return 200 "ok"; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /swagger-ui/ { proxy_pass http://api:8080; }
    location /v3/api-docs { proxy_pass http://api:8080; }

    # File tĩnh có hash: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback; index.html không cache để luôn lấy bản mới
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
